<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Model Viewer FPS Test</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stats.js/build/stats.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    model-viewer { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <!-- Replace model.glb with your 3D asset -->
  <model-viewer id="mv" src="rhino_fromUE.glb" auto-rotate camera-controls></model-viewer>

  <script>
    const stats = new Stats();
    stats.showPanel(0); // 0 = FPS
    document.body.appendChild(stats.dom);
    
    // Make it bigger
    stats.dom.style.transform = "scale(4)";   // 4x larger
    stats.dom.style.transformOrigin = "top left";
    
    const viewer = document.querySelector("model-viewer");
    viewer.addEventListener("load", () => {
        console.log("✅ Model loaded!");
    });
    viewer.addEventListener("error", (e) => {
        console.error("❌ Error loading model:", e.detail);
    });

    function loop() {
      stats.update();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
